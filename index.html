<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CinemaGo - El cine del futuro</title>
  <meta name="description" content="CinemaGo: descubre las mejores películas con un catálogo futurista impulsado por TMDb." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛸</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
    <div class="noise"></div>
  </div>

  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <header class="header">
    <div class="header-inner">
      <h1 class="logo">CINEMA<span>GO</span></h1>
      <form id="search-form" class="search-form" autocomplete="off">
        <input id="search-input" type="text" placeholder="Buscar en el catálogo..." />
        <button type="submit" aria-label="Buscar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>
        </button>
      </form>
    </div>
    <nav class="tabs" aria-label="Categorías">
      <button class="tab active" data-category="popular">Populares</button>
      <button class="tab" data-category="top_rated">Mejor valoradas</button>
      <button class="tab" data-category="now_playing">En cartelera</button>
      <button class="tab" data-category="upcoming">Próximamente</button>
    </nav>
    <div id="genre-filters" class="genre-filters"></div>
  </header>

  <section class="hero" id="hero">
    <div class="hero-backdrop" id="hero-backdrop"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-badge">Película destacada</span>
      <h2 class="hero-title" id="hero-title">Cargando...</h2>
      <p class="hero-meta" id="hero-meta"></p>
      <p class="hero-overview" id="hero-overview"></p>
      <div class="hero-actions">
        <button class="btn-primary" id="hero-more-btn">▶ Ver detalles</button>
        <a class="btn-ghost" href="#catalogo">Explorar catálogo ↓</a>
      </div>
    </div>
  </section>

  <main class="main" id="catalogo">
    <div class="section-head">
      <h2 id="section-title" class="section-title">Populares</h2>
      <span class="section-line"></span>
    </div>
    <div id="movies-grid" class="movies-grid"></div>
    <div id="empty" class="empty hidden">
      <span class="empty-icon">✦</span>
      <p>No se encontraron películas.</p>
    </div>
    <div id="pagination" class="pagination hidden">
      <button id="prev-page" class="page-btn">← Anterior</button>
      <span id="page-info" class="page-info"></span>
      <button id="next-page" class="page-btn">Siguiente →</button>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content" id="modal-content"></div>
  </div>

  <button id="back-to-top" class="back-to-top hidden" aria-label="Volver arriba">↑</button>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-logo">CINEMA<span>GO</span></p>
      <p>Datos proporcionados por <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDb</a>. Esta web usa la API de TMDb pero no está avalada ni certificada por TMDb.</p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
